name: CI

# Every push and pull request: typecheck, lint and test on Windows and Linux.
# The Windows installers are built on the vendor's PC and uploaded to DinePOS Cloud with `npm run release` (P8-11),
# which offers them in the customer portal. CI does not build or publish them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
